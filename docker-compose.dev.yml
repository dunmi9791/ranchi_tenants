# Local development database only:  docker compose -f docker-compose.dev.yml up -d
# Matches DATABASE_URL in .env: postgresql://ranchi:ranchi@localhost:5433/ranchi
services:
  db:
    image: postgres:16-alpine
    container_name: ranchi-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ranchi
      POSTGRES_PASSWORD: ranchi
      POSTGRES_DB: ranchi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-dev-data:/var/lib/postgresql/data

volumes:
  pg-dev-data:
